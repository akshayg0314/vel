apiVersion: score.dev/v1alpha1
kind: VehicleEvidenceCollector
metadata:
  name: npu-runtime-collector
  version: 1.0.0
spec:
  source:
    transport: dds
    topic: VendorANpuRuntimeStatus
    domainId: 100
    messageType: VendorANpuStatus
  inputSchemaRef:
    name: vendor-a-npu-status
    version: 1.2.0
    path: schemas/vendor-a-npu-status-v1.2.0.yaml
  normalizationRuleRef:
    name: vendor-a-npu-to-score-evidence
    version: 3.1.0
    path: mappings/vendor-a-npu-to-evidence-v3.1.0.yaml
  outputSchemaRef:
    name: score-normalized-evidence
    version: 1.0.0
    path: ../vel-output-evidence-package/schemas/score-normalized-evidence-v1.0.0.yaml
  publication:
    transport: dds
    topic: ScoreNormalizedEvidence
    deliveryClass: reliable
  velHealth:
    topic: ScoreEvidenceLayerHealth
    heartbeatPeriod: 1s
  resourceLimits:
    inputQueueDepth: 256
    maximumMessageRate: 1000
