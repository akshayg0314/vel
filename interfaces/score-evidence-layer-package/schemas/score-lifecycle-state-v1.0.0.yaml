apiVersion: score.dev/v1alpha1
kind: RawEvidenceSchema
metadata:
  name: score-lifecycle-state
  version: 1.0.0
spec:
  owner: score
  encoding: json
  messageType: ScoreLifecycleState
  additionalFields: reject
  fields:
    - {name: message_id, path: $.message_id, type: string, required: true}
    - {name: source_id, path: $.source_id, type: string, required: true}
    - {name: workload_id, path: $.workload_id, type: string, required: true}
    - {name: execution_id, path: $.execution_id, type: string, required: true}
    - {name: resource_id, path: $.resource_id, type: string, required: true}
    - {name: timestamp_ns, path: $.timestamp_ns, type: uint64, required: true}
    - name: state
      path: $.state
      type: string
      required: true
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kIdle: idle, kStarting: starting, kRunning: running, kTerminating: terminating, kTerminated: terminated, kFailed: failed}
        unmappedValue: unknown
    - name: previous_state
      path: $.previous_state
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kIdle: idle, kStarting: starting, kRunning: running, kTerminating: terminating, kTerminated: terminated, kFailed: failed}
        unmappedValue: unknown
    - {name: transition_time_ns, path: $.transition_time_ns, type: uint64, required: false}
    - name: run_target
      path: $.details.run_target
      type: string
      required: false
    - {name: exit_code, path: $.details.exit_code, type: int32, required: false}
    - {name: pid, path: $.details.pid, type: uint32, required: false}
    - name: graph_state
      path: $.details.graph_state
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kSuccess: success, kInTransition: in-transition, kAborting: aborting, kCancelled: cancelled, kUndefinedState: undefined-state}
        unmappedValue: unknown
    - name: supervision_status
      path: $.details.supervision_status
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kOk: ok, kFailed: failed}
        unmappedValue: unknown
    - {name: failed_supervision_cycles, path: $.details.failed_supervision_cycles, type: uint32, required: false}
    - name: failed_supervision_type
      path: $.details.failed_supervision_type
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kHeartbeat: heartbeat, kDeadline: deadline, kLogic: logic}
        unmappedValue: unknown
    - name: deadline_error
      path: $.details.deadline_error
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kTooEarly: too_early, kTooLate: too_late}
        unmappedValue: unknown
    - name: heartbeat_error
      path: $.details.heartbeat_error
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kTooEarly: too_early, kTooLate: too_late, kMultipleHeartbeats: multiple_heartbeats}
        unmappedValue: unknown
    - name: logic_error
      path: $.details.logic_error
      type: string
      required: false
      conversion:
        operation: enumMap
        sourceValueKind: enum
        values: {kInvalidState: invalid_state, kInvalidTransition: invalid_transition, kUnmappedError: unmapped_error}
        unmappedValue: unknown
    - {name: deadline_violation, path: $.details.deadline_violation, type: bool, required: false}
    - {name: alive_indication_count, path: $.details.alive_indication_count, type: uint32, required: false}
    - {name: process_execution_error, path: $.details.process_execution_error, type: uint32, required: false}
    - {name: process_group_id, path: $.details.process_group_id, type: string, required: false}
    - {name: recovery_state, path: $.details.recovery_state, type: string, required: false}