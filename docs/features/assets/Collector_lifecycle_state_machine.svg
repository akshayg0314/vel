<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="901px" preserveAspectRatio="none" style="width:1043px;height:901px;background:#F5F5F5;" version="1.1" viewBox="0 0 1043 901" width="1043px" zoomAndPan="magnify"><title>VEL | Collector Lifecycle State Machine</title><defs/><g><rect fill="#F5F5F5" height="901" style="stroke:none;stroke-width:1;" width="1043" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="306.9404" x="361.2548" y="22.9951">VEL | Collector Lifecycle State Machine</text><ellipse cx="400.09" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="PROVISIONED"><rect fill="#FFFFFF" height="78.2031" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="185.6738" x="307.09" y="124.2969"/><line style="stroke:#2D3142;stroke-width:0.5;" x1="307.09" x2="492.7638" y1="150.5938" y2="150.5938"/><text fill="#2D3142" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.0293" x="351.4123" y="142.292">PROVISIONED</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.7871" x="312.09" y="166.7324">Configured and registered</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.6738" x="312.09" y="180.7012">with the Evidence Runtime,</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.7598" x="312.09" y="194.6699">not yet active.</text></g><g id="ACTIVE"><rect fill="#FFFFFF" height="64.2344" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="137.334" x="331.59" y="294.2969"/><line style="stroke:#2D3142;stroke-width:0.5;" x1="331.59" x2="468.924" y1="320.5938" y2="320.5938"/><text fill="#2D3142" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.4561" x="375.029" y="312.292">ACTIVE</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97.7227" x="336.59" y="336.7324">Ready to accept</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.334" x="336.59" y="350.7012">collection requests.</text></g><g id="RUNNING"><rect fill="#FFFFFF" height="64.2344" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="139.127" x="194.59" y="450.2969"/><line style="stroke:#2D3142;stroke-width:0.5;" x1="194.59" x2="333.717" y1="476.5938" y2="476.5938"/><text fill="#2D3142" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.3701" x="230.9684" y="468.292">RUNNING</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.127" x="199.59" y="492.7324">Currently executing</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="107.3848" x="199.59" y="506.7012">a collection cycle.</text></g><g id="SUSPENDED"><rect fill="#FFFFFF" height="64.2344" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="242.3516" x="510.09" y="450.2969"/><line style="stroke:#2D3142;stroke-width:0.5;" x1="510.09" x2="752.4416" y1="476.5938" y2="476.5938"/><text fill="#2D3142" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.1875" x="588.172" y="468.292">SUSPENDED</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.9941" x="515.09" y="492.7324">Temporarily paused</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.3516" x="515.09" y="506.7012">(resource constraints, maintenance).</text></g><g id="ERROR"><rect fill="#FFFFFF" height="64.2344" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="145.1328" x="29.59" y="606.2969"/><line style="stroke:#2D3142;stroke-width:0.5;" x1="29.59" x2="174.7228" y1="632.5