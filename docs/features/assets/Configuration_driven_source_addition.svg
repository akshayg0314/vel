<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="334px" preserveAspectRatio="none" style="width:558px;height:334px;background:#F5F5F5;" version="1.1" viewBox="0 0 558 334" width="558px" zoomAndPan="magnify"><title>VEL | Configuration-Driven Source Addition</title><defs/><g><rect fill="#F5F5F5" height="334" style="stroke:none;stroke-width:1;" width="558" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340.9355" x="107.4385" y="32.9951">VEL | Configuration-Driven Source Addition</text><ellipse cx="176.2998" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="294.0898" x="29.2549" y="87.2969"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.5176" x="39.2549" y="108.4355">Define Input Interface Definition</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.0898" x="39.2549" y="122.4043">(RawEvidenceSchema) for the module's state</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="330.5996" x="11" y="155.2344"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.8984" x="21" y="176.373">Define Normalization Mapping</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="310.5996" x="21" y="190.3418">(EvidenceNormalizationRule) for the module's state</text><rect fill="#FFF1E9" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="309.793" x="21.4033" y="223.1719"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.1797" x="31.4033" y="244.3105">Implement a platform-specific