<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="407px" preserveAspectRatio="none" style="width:631px;height:407px;background:#F5F5F5;" version="1.1" viewBox="0 0 631 407" width="631px" zoomAndPan="magnify"><title>VEL | Configuration-Driven Source Addition</title><defs/><g><rect fill="#F5F5F5" height="407" style="stroke:none;stroke-width:1;" width="631" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340.9355" x="143.9185" y="32.9951">VEL | Configuration-Driven Source Addition</text><ellipse cx="176.2998" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="294.0898" x="29.2549" y="87.2969"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.5176" x="39.2549" y="108.4355">Define Input Interface Definition</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.0898" x="39.2549" y="122.4043">(RawEvidenceSchema) for the module's state</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="330.5996" x="11" y="155.2344"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.8984" x="21" y="176.373">Define Normalization Mapping</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="310.5996" x="21" y="190.3418">(EvidenceNormalizationRule) for the module's state</text><rect fill="#FFF1E9" height="61.9063" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="321.6816" x="15.459" y="223.1719"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="301.6816" x="25.459" y="244.3105">Implement a thin &lt;Module&gt;FieldBindings adapter</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.2285" x="25.459" y="258.2793">(implements shared IStateFieldBindingProvider)</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="289.793" x="25.459" y="272.248">that reads the module's state via its S-CORE API</text><path d="M207.2998,295.0781 L207.2998,341.4766 L187.2998,345.4766 L207.2998,349.4766 L207.2998,395.875 A0,0 0 0 0 207.2998,395.875 L619.7725,395.875 A0,0 0 0 0 619.7725,395.875 L619.7725,305.0781 L609.7725,295.0781 L207.2998,295.0781 A0,0 0 0 0 207.2998,295.0781 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><path d="M609.7725,295.0781 L609.7725,305.0781 L619.7725,305.0781 L609.7725,295.0781 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.7476" x="213.2998" y="312.145">No new Mapper, Validator, or Normalizer class is written.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.998" x="213.2998" y="327.2778">ConfigDrivenStateMapper, SchemaValidator, and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.7183" x="213.2998" y="342.4106">NormalizationProcessor are shared, config-driven</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.4727" x="213.2998" y="357.5435">infrastructure (see Collector_common_class_diagram.puml).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.5127" x="213.2998" y="372.6763">No changes to common VEL processing behavior</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.6499" x="213.2998" y="387.8091">are required (FR-VEL-012, FR-VEL-013/014/015).</text><ellipse cx="176.2998" cy="345.4766" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="176.2998" cy="345.4766" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="176.2998" x2="176.2998" y1="67.2969" y2="87.2969"/><polygon fill="#4F5D75" points="172.2998,77.2969,176.2998,87.2969,180.2998,77.2969,176.2998,81.2969" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="176.2998" x2="176.2998" y1="135.2344" y2="155.2344"/><polygon fill="#4F5D75" points="172.2998,145.2344,176.2998,155.2344,180.2998,145.2344,176.2998,149.2344" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="176.2998" x2="176.2998" y1="203.1719" y2="223.1719"/><polygon fill="#4F5D75" points="172.2998,213.1719,176.2998,223.1719,180.2998,213.1719,176.2998,217.1719" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="176.2998" x2="176.2998" y1="285.0781" y2="334.4766"/><polygon fill="#4F5D75" points="172.2998,324.4766,176.2998,334.4766,180.2998,324.4766,176.2998,328.4766" style="stroke:#4F5D75;stroke-width:1;"/><!--SRC=[XPDlQzj03CRVtwSGxCKIQBeaRTdMZa6QFn1Okv90tnRLfyIYzfsdEoTizCDFlYJ5NLDcOtES7_-aHoT5ZWN1_VG7FCFOknMlQy78tlKcmXjoiFIrP0GZQxdPDk69NOM29JnYzhGMNpixzeKN-32xQEwM8kHe_PRT6bPO16fzsVycZWI-jFP78dwxnvtFBYQVspZC8cyu_hxsOadsgk7aR70-FAPwarwwZYXdtiNtQ9QnzCw-2laciOFetuZJSNEtXCv7-dzUITKEU3qRzyTzOq94YUPoGYjs17DNrL7VaMI5UaHfUtT8dGLkfnksv39QPZcLs8MLac9EK7fR5_GnWD8YNRtWRhsKMF2VTFfmWrMb1sSw1yohpmibl4zi70scNo_dPLLGIIu2geuTVBj9okypfi9UixCQ8G1QhDI3wV117vhE4R8mNpR4jlnEV9EGT4tCCO8Gsd0a2TWm0YjesHl_N4nXT3U_qlBvofYckY2ypgEvzU1ecxoIdC2z-hCOlIxLsS6mTcXMO0Z00RR2CP8xDRjHsOr8ol70s5MxHK9dpQlQgOECGj08Qd5lz0Io1EpPH3JiLe8XIft5MaMTGAJJMHIKAVCXywMssqFAwa5xRwrDSrhLPT4zRInbERerQLLqcPHflAjTs6OO7od73NinJG92lsfkQjsPBNegxFK7mnDuMPzzwW_EzRbGDZcRUlCl]--></g></svg>