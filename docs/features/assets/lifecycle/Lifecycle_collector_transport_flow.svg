<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="645px" preserveAspectRatio="none" style="width:996px;height:645px;background:#F5F5F5;" version="1.1" viewBox="0 0 996 645" width="996px" zoomAndPan="magnify"><title>S-CORE Lifecycle Collector | Transport Flow</title><defs/><g><rect fill="#F5F5F5" height="645" style="stroke:none;stroke-width:1;" width="996" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.0703" x="325.5732" y="32.9951">S-CORE Lifecycle Collector | Transport Flow</text><ellipse cx="498.1084" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="285.7461" x="355.2354" y="87.2969"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.0137" x="365.2354" y="108.4355">Launch Manager emits process life status</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.7461" x="365.2354" y="122.4043">(comp_req_launch_man_ext_monitor_notify)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="311.6621" x="342.2773" y="155.2344"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.5215" x="352.2773" y="176.373">Collector reads ProcessState / GraphState</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.6621" x="352.2773" y="190.3418">(ProcessInfoNode::getState(), Graph::getState())</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="974.2168" x="11" y="223.1719"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.4414" x="21" y="244.3105">Collector receives Health Monitor supervision status</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="954.2168" x="21" y="258.2793">(supervision_status, failed_supervision_type, deadline_error, heartbeat_error, logic_error, deadline_violation, failed_supervision_cycles, alive_indication_count)</text><rect fill="#FFF1E9" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="354.5586" x="320.8291" y="291.1094"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.7813" x="330.8291" y="312.248">VEL Lifecycle Collector maps fields</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.5586" x="330.8291" y="326.2168">(C++ binding to Launch Manager &amp; Health Monitor API)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="358.0508" x="319.083" y="359.0469"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.4648" x="329.083" y="380.1855">Produce raw state record</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="338.0508" x="329.083" y="394.1543">(conforms to score-lifecycle-state RawEvidenceSchema)</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="287.2402" x="354.4883" y="426.9844"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.2402" x="364.4883" y="448.123">Schema Validator validates raw state record</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="395.0586" x="300.5791" y="480.9531"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="375.0586" x="310.5791" y="502.0918">Normalization Processor maps to normalized Vehicle Evidence</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="301.7246" x="347.2461" y="534.9219"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.7676" x="357.2461" y="556.0605">Publish normalized Vehicle Evidence</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.7246" x="357.2461" y="570.0293">(DDS topic ScoreNormalizedEvidence, reliable)</text><path d="M529.1084,593.7266 L529.1084,609.8594 L509.1084,613.8594 L529.1084,617.8594 L529.1084,633.9922 A0,0 0 0 0 529.1084,633.9922 L830.3511,633.9922 A0,0 0 0 0 830.3511,633.9922 L830.3511,603.7266 L820.3511,593.7266 L529.1084,593.7266 A0,0 0 0 0 529.1084,593.7266 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><path d="M820.3511,593.7266 L820.3511,603.7266 L830.3511,603.7266 L820.3511,593.7266 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.856" x="535.1084" y="610.7935">Read-only: the collector never sends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.2427" x="535.1084" y="625.9263">control commands to the Launch Manager.</text><ellipse cx="498.1084" cy="613.8594" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="498.1084" cy="613.8594" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="498.1084" x2="498.1084" y1="67.2969" y2="87.2969"/><polygon fill="#4F5D75" points="494.1084,77.2969,498.1084,87.2969,502.1084,77.2969,498.1084,81.2969" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="498.1084" x2="498.1084" y1="135.2344" y2="155.2344"/><polygon fill="#4F5D75" points="494.1084,145.2344,498.1084,155.2344,502.1084,145.2344,498.1084,149.2344" style="stroke:#4F5D75;