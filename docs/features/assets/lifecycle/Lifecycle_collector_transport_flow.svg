<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="592px" preserveAspectRatio="none" style="width:559px;height:592px;background:#F5F5F5;" version="1.1" viewBox="0 0 559 592" width="559px" zoomAndPan="magnify"><title>S-CORE Lifecycle Collector | Transport Flow</title><defs/><g><rect fill="#F5F5F5" height="592" style="stroke:none;stroke-width:1;" width="559" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.0703" x="107.0574" y="32.9951">S-CORE Lifecycle Collector | Transport Flow</text><ellipse cx="214.9424" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="407.8848" x="11" y="87.2969"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="387.8848" x="21" y="108.4355">Launch Manager emits process life status via ext_monitor_notify</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.8574" x="21" y="122.4043">(supervision + exit/error fields)</text><rect fill="#FFFFFF" height="61.9063" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="377.2754" x="26.3047" y="155.2344"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="357.2754" x="36.3047" y="176.373">Collector reads ProcessState / GraphState / pid / run_target</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="290.7949" x="36.3047" y="190.3418">(ProcessInfoNode::getState(), Graph::getState(),</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="290.7129" x="36.3047" y="204.3105">ProcessInfoNode::getPid(), LM::get_run_target())</text><rect fill="#FFF1E9" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="354.5586" x="37.6631" y="237.1406"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.7813" x="47.6631" y="258.2793">VEL Lifecycle Collector maps fields</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.5586" x="47.6631" y="272.248">(C++ binding to Launch Manager &amp; Health Monitor API)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="358.0508" x="35.917" y="305.0781"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.4648" x="45.917" y="326.2168">Produce raw state record</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="338.0508" x="45.917" y="340.1855">(conforms to score-lifecycle-state RawEvidenceSchema)</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="287.2402" x="71.3223" y="373.0156"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.2402" x="81.3223" y="394.1543">Schema Validator validates raw state record</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="395.0586" x="17.4131" y="426.9844"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="375.0586" x="27.4131" y="448.123">Normalization Processor maps to normalized Vehicle Evidence</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="301.7246" x="64.0801" y="480.9531"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.7676" x="74.0801" y="502.0918">Publish normalized Vehicle Evidence</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.7246" x="74.0801" y="516.0605">(DDS topic ScoreNormalizedEvidence, reliable)</text><path d="M245.9424,539.7578 L245.9424,555.8906 L225.9424,559.8906 L245.9424,563.8906 L245.9424,580.0234 A0,0 0 0 0 245.9424,580.0234 L547.1851,580.0234 A0,0 0 0 0 547.1851,580.0234 L547.1851,549.7578 L537.1851,539.7578 L245.9424,539.7578 A0,0 0 0 0 245.9424,539.7578 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><path d="M537.1851,539.7578 L537.1851,549.7578 L547.1851,549.7578 L537.1851,539.7578 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.856" x="251.9424" y="556.8247">Read-only: the collector never sends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.2427" x="251.9424" y="571.9575">control commands to the Launch Manager.</text><ellipse cx="214.9424" cy="559.8906" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="214.9424" cy="559.8906" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="214.9424" x2="214.9424" y1="67.2969" y2="87.2969"/><polygon fill="#4F5D75" points="210.9424,77.2969,214.9424,87.2969,218.9424,77.2969,214.9424,81.2969" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="214.9424" x2="214.9424" y1="135.2344" y2="155.2344"/><polygon fill="#4F5D75" points="210.9424,145.2344,214.9424,155.2344,218.9424,145.2344,214.9424,149.2344" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="214.9424" x2="214.9424" y1="217.1406" y2="237.1406"/><polygon fill="#4F5D75" points="210.9424,227.1406,214.9424,237.1406,218.9424,227.1406,214.9424,231.1406" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="214.9424" x2="214.9424" y1="285.0781" y2="305.0781"/><polygon fill="#4F5D75" points="210.9424,295.0781,214.942