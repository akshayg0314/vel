<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="564px" preserveAspectRatio="none" style="width:534px;height:564px;background:#F5F5F5;" version="1.1" viewBox="0 0 534 564" width="534px" zoomAndPan="magnify"><title>S-CORE Lifecycle Collector | Transport Flow</title><defs/><g><rect fill="#F5F5F5" height="564" style="stroke:none;stroke-width:1;" width="534" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.0703" x="94.5989" y="32.9951">S-CORE Lifecycle Collector | Transport Flow</text><ellipse cx="190.0254" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="297.7461" x="41.1523" y="87.2969"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.0137" x="51.1523" y="108.4355">Launch Manager emits process life status</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277.7461" x="51.1523" y="122.4043">(comp_req__launch_man__ext_monitor_notify)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="311.6621" x="34.1943" y="155.2344"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.5215" x="44.1943" y="176.373">Collector reads ProcessState / GraphState</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.6621" x="44.1943" y="190.3418">(ProcessInfoNode::getState(), Graph::getState())</text><rect fill="#FFF1E9" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="248.7383" x="65.6563" y="223.1719"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.7813" x="75.6563" y="244.3105">VEL Lifecycle Collector maps fields</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.7383" x="75.6563" y="258.2793">(C++ binding to Launch Manager API)</text><rect fill="#FFFFFF" height="47.9375" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="358.0508" x="11" y="291.1094"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.4648" x="21" y="312.248">Produce raw state record</text><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="338.0508" x="21" y="326.2168">(conforms to score-lifecycle-state RawEvidenceSchema)</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="126.2422" x="126.9043" y="359.0469"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.2422" x="136.9043" y="380.1855">Schema Validator</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="103.6016" x="138.2246" y="413.0156"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.6016" x="148.2246" y="434.1543">Normalization</text><rect fill="#FFFFFF" height="33.9688" rx="4" ry="4" style="stroke:#2D3142;stroke-width:0.5;" width="74.6035" x="152.7236" y="466.9844"/><text fill="#2D3142" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.6035" x="162.7236" y="488.123">Evidence</text><path d="M221.0254,511.8203 L221.0254,527.9531 L201.0254,531.9531 L221.0254,535.9531 L221.0254,552.0859 A0,0 0 0 0 221.0254,552.0859 L522.2681,552.0859 A0,0 0 0 0 522.2681,552.0859 L522.2681,521.8203 L512.2681,511.8203 L221.0254,511.8203 A0,0 0 0 0 221.0254,511.8203 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><path d="M512.2681,511.8203 L512.2681,521.8203 L522.2681,521.8203 L512.2681,511.8203 " fill="#FFFFFF" style="stroke:#BFC0C0;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.856" x="227.0254" y="528.8872">Read-only: the collector never sends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.2427" x="227.0254" y="544.02">control commands to the Launch Manager.</text><ellipse cx="190.0254" cy="531.9531" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="190.0254" cy="531.9531" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="67.2969" y2="87.2969"/><polygon fill="#4F5D75" points="186.0254,77.2969,190.0254,87.2969,194.0254,77.2969,190.0254,81.2969" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="135.2344" y2="155.2344"/><polygon fill="#4F5D75" points="186.0254,145.2344,190.0254,155.2344,194.0254,145.2344,190.0254,149.2344" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="203.1719" y2="223.1719"/><polygon fill="#4F5D75" points="186.0254,213.1719,190.0254,223.1719,194.0254,213.1719,190.0254,217.1719" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="271.1094" y2="291.1094"/><polygon fill="#4F5D75" points="186.0254,281.1094,190.0254,291.1094,194.0254,281.1094,190.0254,285.1094" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="339.0469" y2="359.0469"/><polygon fill="#4F5D75" points="186.0254,349.0469,190.0254,359.0469,194.0254,349.0469,190.0254,353.0469" style="stroke:#4F5D75;stroke-width:1;"/><line style="stroke:#4F5D75;stroke-width:1;" x1="190.0254" x2="190.0254" y1="393.0156" y2="413.0156"/><polygon fill="#4F5D75" points="186.0254,403.0156,190.0254,413.0156,194.0254,403.01